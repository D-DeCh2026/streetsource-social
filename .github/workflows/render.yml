name: Render social cards

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["renderer/**", ".github/workflows/render.yml", "README.md"]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new cards
        id: check
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, io, os, urllib.request
          from pathlib import Path
          sid = "1dT-3jIGWm3klZ5Kdbz3VGx5LCvZLEB3p_PDZowcfS4E"
          try:
              raw = urllib.request.urlopen(f"https://docs.google.com/spreadsheets/d/{sid}/export?format=csv&gid=0", timeout=60).read().decode()
          except Exception as e:
              raw = "<" + str(e)
          if raw.lstrip().startswith("<"):
              import sys
              print("::error::Can't read the Street Source Image Specs sheet. Set its sharing to Anyone with the link: Viewer.", file=sys.stderr)
              sys.exit(1)
          rows = list(csv.reader(io.StringIO(raw)))[1:]
          missing = [r[0] for r in rows if r and r[0].strip().endswith((".png", ".mp4")) and not Path(r[0].strip()).exists()]
          print("needed=" + ("true" if missing else "false"))
          EOF

      - name: Install renderer
        if: steps.check.outputs.needed == 'true'
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p "$RUNNER_TEMP/fonts" && cd "$RUNNER_TEMP/fonts"
          npm pack @fontsource/barlow-condensed @fontsource/archivo
          for f in *.tgz; do tar xzf "$f" --one-top-level; done

      - name: Render
        id: render
        if: steps.check.outputs.needed == 'true'
        continue-on-error: true
        run: python renderer/render_sheet.py "$RUNNER_TEMP"

      - name: Commit images
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "streetsource-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Render social cards"
          git push

      - name: Report render problems
        if: steps.render.outcome == 'failure'
        run: exit 1
